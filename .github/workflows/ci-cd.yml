name: CI/CD

on:
  pull_request:
    branches: [Dev, Val, Prod]
  push:
    branches: [Dev, Val, Prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests du backend
        working-directory: backend
        run: |
          npm install
          npm test

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, db]
    steps:
      - uses: actions/checkout@v4
      - name: Calculer le tag de l'environnement
        run: |
          if [ "${GITHUB_REF_NAME}" = "Prod" ]; then
            echo "TAG=prod" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME,,}" >> "$GITHUB_ENV"
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/monapp-${{ matrix.service }}:${{ env.TAG }}

  deploy:
    if: github.event_name == 'push' && github.ref_name != 'Dev'
    needs: build-push
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Déployer sur Kubernetes
        run: |
          if [ "${GITHUB_REF_NAME}" = "Prod" ]; then NS=prod; else NS=val; fi
          kubectl apply -f "k8s/${NS}/"
          kubectl rollout restart deployment/backend deployment/frontend -n "${NS}"
          kubectl rollout status deployment/backend -n "${NS}" --timeout=180s
          kubectl rollout status deployment/frontend -n "${NS}" --timeout=180s
