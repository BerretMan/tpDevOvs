<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TP DevOps</title>
	<style>
		body.dark { background: #1e1e1e; color: #e6e6e6; }
		body.dark input { background: #2d2d2d; color: #e6e6e6; border: 1px solid #555; }
	</style>
</head>
<body>
	<h1>TP DevOps</h1>
	<button id="theme" type="button">Mode sombre</button>
	<h2>Liste des membres</h2>
	<nav>
	<ul>
	    <li>Lucas</li>
	    <li>Nylan</li>
	    <li>Mathéo</li>
	</ul>
	</nav>
	<h2>Tâches</h2>
	<input type="search" id="search" placeholder="Rechercher par titre..." aria-label="Rechercher une tâche">
	<p id="status">Chargement...</p>
	<ul id="tasks"></ul>
	<script>
	const statusEl = document.getElementById('status');
	const list = document.getElementById('tasks');
	const searchEl = document.getElementById('search');
	const themeEl = document.getElementById('theme');
	function applyTheme(dark) {
		document.body.classList.toggle('dark', dark);
		themeEl.textContent = dark ? 'Mode clair' : 'Mode sombre';
		try { localStorage.setItem('dark', dark ? '1' : '0'); } catch (e) {}
	}
	themeEl.addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
	try { applyTheme(localStorage.getItem('dark') === '1'); } catch (e) {}
	let timer;
	let seq = 0;

	function loadTasks(q) {
		const id = ++seq;
		const url = q ? '/api/tasks?q=' + encodeURIComponent(q) : '/api/tasks';
		fetch(url)
			.then((res) => res.json())
			.then((tasks) => {
				if (id !== seq) return;
				list.innerHTML = '';
				tasks.forEach((t) => {
					const li = document.createElement('li');
					li.textContent = t.title;
					list.appendChild(li);
				});
				statusEl.textContent = tasks.length ? '' : 'Aucune tâche trouvée';
			})
			.catch(() => {
				if (id !== seq) return;
				statusEl.textContent = "Impossible de joindre l'API";
			});
	}

	searchEl.addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(() => loadTasks(searchEl.value.trim()), 250);
	});
	loadTasks('');
	</script>
</body>
</html>
