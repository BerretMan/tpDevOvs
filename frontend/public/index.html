<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TP DevOps</title>
</head>
<body>
	<h1>TP DevOps</h1>
	<h2>Liste des membres</h2>
	<nav>
	<ul>
	    <li>Lucas</li>
	    <li>Nylan</li>
	    <li>Mathéo</li>
	</ul>
	</nav>
	<h2>Tâches</h2>
	<form id="add-form">
		<input id="title" placeholder="Nouvelle tâche" required>
		<button type="submit">Ajouter</button>
	</form>
	<input type="search" id="search" placeholder="Rechercher par titre..." aria-label="Rechercher une tâche">
	<p id="status">Chargement...</p>
	<ul id="tasks"></ul>
	<script>
	const statusEl = document.getElementById('status');
	const list = document.getElementById('tasks');
	const searchEl = document.getElementById('search');
	let timer;
	let seq = 0;

	function loadTasks(q) {
		const id = ++seq;
		const url = q ? '/api/tasks?q=' + encodeURIComponent(q) : '/api/tasks';
		fetch(url)
			.then((res) => res.json())
			.then((tasks) => {
				if (id !== seq) return;
				list.innerHTML = '';
				tasks.forEach((t) => {
					const li = document.createElement('li');
					const title = document.createElement('span');
					title.textContent = t.title + ' ';
					const del = document.createElement('button');
					del.textContent = 'Supprimer';
					del.addEventListener('click', async () => {
						await fetch('/api/tasks/' + t.id, { method: 'DELETE' });
						loadTasks(searchEl.value.trim());
					});
					li.append(title, del);
					list.appendChild(li);
				});
				statusEl.textContent = tasks.length ? '' : 'Aucune tâche trouvée';
			})
			.catch(() => {
				if (id !== seq) return;
				statusEl.textContent = "Impossible de joindre l'API";
			});
	}

	searchEl.addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(() => loadTasks(searchEl.value.trim()), 250);
	});
	document.getElementById('add-form').addEventListener('submit', async (e) => {
		e.preventDefault();
		const input = document.getElementById('title');
		await fetch('/api/tasks', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ title: input.value }),
		});
		input.value = '';
		loadTasks(searchEl.value.trim());
	});
	loadTasks('');
	</script>
</body>
</html>
