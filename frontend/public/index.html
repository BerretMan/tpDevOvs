<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TP DevOps</title>
	<style>
		body.dark { background: #1e1e1e; color: #e6e6e6; }
		body.dark input { background: #2d2d2d; color: #e6e6e6; border: 1px solid #555; }
	</style>
</head>
<body>
	<h1>TP DevOps</h1>
	<button id="theme" type="button">Mode sombre</button>
	<h2>Liste des membres</h2>
	<nav>
	<ul>
	    <li>Lucas</li>
	    <li>Nylan</li>
	    <li>Mathéo</li>
	</ul>
	</nav>
	<h2>Tâches</h2>
	<form id="add-form">
		<input id="title" placeholder="Nouvelle tâche" required>
		<button type="submit">Ajouter</button>
	</form>
	<input type="search" id="search" placeholder="Rechercher par titre..." aria-label="Rechercher une tâche">
	<select id="filter" aria-label="Filtrer par statut">
		<option value="all">Toutes</option>
		<option value="todo">À faire</option>
		<option value="done">Faites</option>
	</select>
	<p id="status">Chargement...</p>
	<p id="counter"></p>
	<ul id="tasks"></ul>
	<script>
	const statusEl = document.getElementById('status');
	const list = document.getElementById('tasks');
	const searchEl = document.getElementById('search');
	const filterEl = document.getElementById('filter');
	const themeEl = document.getElementById('theme');
	function applyTheme(dark) {
		document.body.classList.toggle('dark', dark);
		themeEl.textContent = dark ? 'Mode clair' : 'Mode sombre';
		try { localStorage.setItem('dark', dark ? '1' : '0'); } catch (e) {}
	}
	themeEl.addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
	try { applyTheme(localStorage.getItem('dark') === '1'); } catch (e) {}
	let timer;
	let seq = 0;

	function loadTasks(q) {
		const id = ++seq;
		const url = q ? '/api/tasks?q=' + encodeURIComponent(q) : '/api/tasks';
		fetch(url)
			.then((res) => res.json())
			.then((tasks) => {
				if (id !== seq) return;
				list.innerHTML = '';
				const f = filterEl.value;
				tasks = tasks.filter((t) => f === 'all' || (f === 'done') === t.done);
				tasks.forEach((t) => {
					const li = document.createElement('li');
					if (t.done) li.className = 'done';
					const box = document.createElement('input');
					box.type = 'checkbox';
					box.checked = t.done;
					box.setAttribute('aria-label', 'Marquer comme faite');
					box.addEventListener('change', () => toggleTask(t.id, box.checked));
					const label = document.createElement('span');
					label.textContent = t.title;
					const del = document.createElement('button');
					del.textContent = 'Supprimer';
					del.addEventListener('click', () => deleteTask(t.id));
					li.append(box, ' ', label, ' ', del);
					list.appendChild(li);
				});
				const remaining = tasks.filter((t) => !t.done).length;
				document.getElementById('counter').textContent =
					remaining + ' tâche' + (remaining > 1 ? 's' : '') + ' restante' + (remaining > 1 ? 's' : '');
				statusEl.textContent = tasks.length ? '' : 'Aucune tâche trouvée';
			})
			.catch(() => {
				if (id !== seq) return;
				statusEl.textContent = "Impossible de joindre l'API";
			});
	}

	function toggleTask(id, done) {
		fetch('/api/tasks/' + id, {
			method: 'PATCH',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ done }),
		})
			.then((res) => { if (!res.ok) throw new Error(); })
			.catch(() => { statusEl.textContent = 'Mise à jour impossible'; })
			.finally(() => loadTasks(searchEl.value.trim()));
	}

	function deleteTask(id) {
		fetch('/api/tasks/' + id, { method: 'DELETE' })
			.then((res) => { if (!res.ok) throw new Error(); })
			.catch(() => { statusEl.textContent = 'Suppression impossible'; })
			.finally(() => loadTasks(searchEl.value.trim()));
	}

	document.getElementById('add-form').addEventListener('submit', (e) => {
		e.preventDefault();
		const input = document.getElementById('title');
		fetch('/api/tasks', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ title: input.value }),
		})
			.then((res) => { if (!res.ok) throw new Error(); input.value = ''; })
			.catch(() => { statusEl.textContent = 'Ajout impossible'; })
			.finally(() => loadTasks(searchEl.value.trim()));
	});

	searchEl.addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(() => loadTasks(searchEl.value.trim()), 250);
	});
	filterEl.addEventListener('change', () => loadTasks(searchEl.value.trim()));
	loadTasks('');
	</script>
</body>
</html>
