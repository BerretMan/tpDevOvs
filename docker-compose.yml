services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: monapp
      POSTGRES_PASSWORD: monapp
      POSTGRES_DB: monapp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monapp -d monapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: monapp
      DB_PASSWORD: monapp
      DB_NAME: monapp
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
